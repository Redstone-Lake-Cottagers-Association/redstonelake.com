<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lake Association Sign - draft, Nov 26 2026 - 68 x 40 in</title>
<style>
/* One unit (--u) = one inch of the real sign.
   Print: --u is 1in and the page is 68in x 40in.
   Preview: open with ?px=30 to draw it 30 px per inch. */
@font-face {
  font-family: "Oswald";
  src: url("Oswald-Variable.ttf") format("truetype");
  font-weight: 200 700;
}
:root {
  --u: 1in;
  --rust: #9c301a;
  --ink: #111111;
  --frame: 1.5;      /* rust border, inches */
}
@page { size: 68in 40in; margin: 0; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body { width: calc(var(--u) * 68); height: calc(var(--u) * 40); overflow: hidden; }

.sign {
  position: relative;
  width: calc(var(--u) * 68);
  height: calc(var(--u) * 40);
  background: var(--rust);
  font-family: "Oswald", sans-serif;
  color: var(--ink);
  -webkit-print-color-adjust: exact; print-color-adjust: exact;
}
.panel {
  position: absolute;
  inset: calc(var(--u) * var(--frame));
  background: #fff;
}
.abs { position: absolute; }

/* emblem */
.emblem { left: calc(var(--u) * 2.75); top: calc(var(--u) * 2.4); width: calc(var(--u) * 22); height: calc(var(--u) * 22); }
.emblem img { position: absolute; inset: 0; width: 100%; height: 100%; }
.emblem svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

/* name + url block, right of the emblem */
.name {
  left: calc(var(--u) * 27.35);
  top: 0;
  font-weight: 600;
  text-transform: uppercase;
  line-height: 1;
  white-space: nowrap;
}
.name .line { display: block; }
.url {
  left: calc(var(--u) * 27.35);
  white-space: nowrap;
  font-weight: 500;
  line-height: 1;
}

/* lakes */
.rule { left: calc(var(--u) * 2.75); right: calc(var(--u) * 2.75); height: calc(var(--u) * 0.35); background: var(--rust); }
.lakes {
  left: 0; right: 0;
  text-align: center;
  font-weight: 400;
  line-height: 1.32;
  white-space: nowrap;
}
.dot { color: var(--rust); padding: 0 0.18em; }
</style>
<script>
  const m = location.search.match(/px=([\d.]+)/);
  if (m) document.documentElement.style.setProperty('--u', m[1] + 'px');
</script>
</head>
<body>
<div class="sign" id="sign">
  <div class="panel">
    <div class="abs emblem" id="emblem">
      <!-- vector emblem with its rust ring, traced by build_emblem_svg.py -->
      <img src="emblem.svg" alt="">
    </div>

    <div class="abs name" id="name" data-fit="34.9">
      <span class="line">Redstone Area</span>
      <span class="line">Lakes Association</span>
    </div>

    <div class="abs url" id="url" data-fit="22">redstonelakes.ca</div>

    <div class="abs rule" id="rule"></div>

    <div class="abs lakes" id="lakes">
      Bitter<span class="dot">&bull;</span>Burdock<span class="dot">&bull;</span>Coleman<span class="dot">&bull;</span>Long (Tedious)<br>
      Pelaw<span class="dot">&bull;</span>Redstone<span class="dot">&bull;</span>Little Redstone
    </div>
  </div>
</div>

<script>
/* Layout in inches, measured once fonts are in. */
(async () => {
  await document.fonts.ready;
  const pm = location.search.match(/px=([\d.]+)/);
  const unit = pm ? +pm[1] : 96; // css px per inch of sign (print: 1in = 96 css px)
  const IN = v => v * unit;

  // fit a block so its widest line is exactly `w` inches wide
  function fit(el, w) {
    el.style.fontSize = IN(10) + 'px';
    const lines = el.querySelectorAll('.line');
    const widths = (lines.length ? [...lines] : [el]).map(n => {
      const r = document.createRange(); r.selectNodeContents(n); return r.getBoundingClientRect().width;
    });
    const s = IN(10) * IN(w) / Math.max(...widths);
    el.style.fontSize = s + 'px';
    return s;
  }
  // cap height of Oswald, as a share of font size
  const CAP = 0.81;

  const name = document.getElementById('name');
  const nameSize = fit(name, +name.dataset.fit);
  const nameLines = name.querySelectorAll('.line');
  nameLines[1].style.marginTop = (nameSize * 0.13) + 'px';

  const url = document.getElementById('url');
  const urlSize = nameSize * 0.80;
  url.style.fontSize = urlSize + 'px';
  // Oswald: cap height 0.81 em; with line-height 1 the cap top sits ~0.17 em below the box top
  // and the baseline ~0.98 em below it. Block = name cap-top .. url baseline.
  const gapNameUrl = nameSize * 0.62;          // baseline of line 2 to cap-top of url
  const lineStep = nameSize * 1.13;            // line 1 top to line 2 top
  const capTopOff = 0.17, baseOff = 0.98;
  const blockH = (lineStep + nameSize * baseOff) - nameSize * capTopOff + gapNameUrl + urlSize * (baseOff - capTopOff);
  const emblemMid = IN(2.4 + 11);
  const capTop = emblemMid - blockH / 2;
  name.style.top = (capTop - nameSize * capTopOff) + 'px';
  const nameBase = capTop - nameSize * capTopOff + lineStep + nameSize * baseOff;
  url.style.top = (nameBase + gapNameUrl - urlSize * capTopOff) + 'px';

  // lakes band: rule then two centred lines
  const panel = document.querySelector('.panel').getBoundingClientRect();
  const rule = document.getElementById('rule');
  rule.style.top = IN(26.3) + 'px';
  const lakes = document.getElementById('lakes');
  lakes.style.fontSize = IN(3.05) + 'px';
  lakes.style.top = IN(27.45) + 'px';

  // report sizes for the README
  window.__sizes = {
    nameCapIn: +(nameSize / unit * CAP).toFixed(2),
    urlCapIn: +(urlSize / unit * CAP).toFixed(2),
    lakesCapIn: +(IN(3.05) / unit * CAP).toFixed(2),
  };
  document.body.dataset.sizes = JSON.stringify(window.__sizes);
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
